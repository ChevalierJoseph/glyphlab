<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Op-Art Generator</title>
<style>
:root{--ink:#000;--paper:#fff;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px}
#side{width:280px;flex:none;border-right:1px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
#side h1{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:0}
.group{display:flex;flex-direction:column;gap:6px}
.group label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.6}
.group .val{float:right;opacity:1}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 10px;letter-spacing:.1em;text-transform:uppercase;font-size:10px;transition:all .12s}
button:hover{background:var(--ink);color:var(--paper)}
select{font:inherit;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px}
input[type=range]{width:100%;accent-color:#000}
.row{display:flex;gap:8px}
.row button{flex:1}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0}
canvas{max-width:100%;max-height:100%;border:1px solid var(--ink);background:var(--paper);image-rendering:pixelated}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:640px){body{flex-direction:column}#side{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--ink)}}
</style>
</head>
<body>
<aside id="side">
  <h1>Op-Art Generator</h1>
  <div class="group">
    <label>Style</label>
    <select id="style">
      <option value="spiral-zigzag">Spirale zigzag</option>
      <option value="spiral-curve">Spirale courbe</option>
      <option value="vortex">Vortex</option>
      <option value="moire-rings">Anneaux moiré</option>
      <option value="checker-distort">Damier déformé</option>
    </select>
  </div>
  <div class="group">
    <label>Tours <span class="val" id="v-turns"></span></label>
    <input type="range" id="turns" min="2" max="16" step="1">
  </div>
  <div class="group">
    <label>Épaisseur <span class="val" id="v-thick"></span></label>
    <input type="range" id="thick" min="2" max="60" step="1">
  </div>
  <div class="group">
    <label>Densité <span class="val" id="v-dens"></span></label>
    <input type="range" id="dens" min="4" max="64" step="1">
  </div>
  <div class="group">
    <label>Rotation <span class="val" id="v-rot"></span>°</label>
    <input type="range" id="rot" min="0" max="360" step="1">
  </div>
  <div class="group">
    <label>Graine <span class="val" id="v-seed"></span></label>
    <input type="range" id="seed" min="0" max="999" step="1">
  </div>
  <div class="group">
    <label>Inverser</label>
    <select id="invert"><option value="0">Non</option><option value="1">Oui</option></select>
  </div>
  <div class="row">
    <button id="rand">Aléatoire</button>
    <button id="png">Export PNG</button>
  </div>
</aside>
<main id="stage"><canvas id="cv" width="900" height="900"></canvas></main>
<div id="toast">Copié</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const S=900,C=S/2;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function render(){
  const st=$('style').value;
  const turns=+$('turns').value,thick=+$('thick').value,dens=+$('dens').value;
  const rot=+$('rot').value*Math.PI/180,seed=+$('seed').value,inv=$('invert').value==='1';
  ctx.save();
  ctx.fillStyle=inv?'#000':'#fff';ctx.fillRect(0,0,S,S);
  ctx.fillStyle=inv?'#fff':'#000';
  ctx.strokeStyle=ctx.fillStyle;
  ctx.translate(C,C);ctx.rotate(rot);
  const R=S*0.72,TURNS=turns,TH=thick;
  if(st==='spiral-zigzag'||st==='spiral-curve'){
    const N=dens*2,seg=st==='spiral-zigzag';
    const pts=[];
    for(let i=0;i<=N;i++){
      const t=i/N,a=t*TURNS*2*Math.PI,r=t*R;
      const wob=Math.sin(a*dens/8+seed)*8;
      pts.push([Math.cos(a)*(r+wob),Math.sin(a)*(r+wob)]);
    }
    for(let k=0;k<2;k++){
      ctx.beginPath();
      ctx.lineWidth=TH;
      for(let side=-1;side<=1;side+=2){
        const off=k?TH/2*side:0;
        ctx.moveTo(pts[0][0]+off,pts[0][1]);
        for(let i=1;i<pts.length;i++){
          const p=pts[i];
          if(seg&&i%2===0)ctx.lineTo(p[0]+off,p[1]);
          else if(seg)ctx.lineTo(pts[i-1][0]+off,p[1]);
          else{
            const q=pts[i-1];
            ctx.bezierCurveTo(q[0]+off,q[1],p[0]+off,p[1],p[0]+off,p[1]);
          }
        }
      }
      if(k===0)ctx.stroke();
    }
  }else if(st==='vortex'){
    const rnd=mulberry(seed+1);
    const N=dens*3;
    for(let i=0;i<N;i++){
      const t=i/N,a0=t*TURNS*2*Math.PI+rnd()*0.4;
      ctx.save();
      ctx.rotate(a0);
      ctx.beginPath();
      const w0=TH*(0.4+t*1.2);
      ctx.ellipse(t*R,0,w0,Math.max(2,TH*0.28*t),0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }else if(st==='moire-rings'){
    const N=dens;
    for(let i=N;i>0;i--){
      const r=i/N*R;
      const wob=TH*Math.sin(i*1.3+seed)*0.5;
      ctx.beginPath();
      ctx.arc(0,0,Math.abs(r+wob),0,Math.PI*2);
      ctx.lineWidth=TH;ctx.stroke();
    }
  }else if(st==='checker-distort'){
    const rnd=mulberry(seed+7);
    const n=Math.max(3,Math.round(dens/2)),cell=S/n*1.1;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      if((x+y)%2)continue;
      const ph=rnd()*Math.PI*2;
      const k=0.5+0.5*Math.sin(Math.hypot(x-n/2,y-n/2)*0.9+seed*0.05+ph);
      const s=cell*(0.55+0.45*k);
      ctx.fillRect((x-n/2)*cell-s/2,(y-n/2)*cell-s/2,s,s);
    }
  }
  ctx.restore();
  updateLabels();
}

function updateLabels(){
  $('v-turns').textContent=$('turns').value;
  $('v-thick').textContent=$('thick').value;
  $('v-dens').textContent=$('dens').value;
  $('v-rot').textContent=$('rot').value;
  $('v-seed').textContent=$('seed').value;
}

['style','turns','thick','dens','rot','seed','invert'].forEach(id=>{
  $(id).addEventListener('input',render);
  $(id).addEventListener('change',render);
});

function setRand(){
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  $('turns').value=r(2,16);$('thick').value=r(2,60);
  $('dens').value=r(4,64);$('rot').value=r(0,360);$('seed').value=r(0,999);
  const styles=['spiral-zigzag','spiral-curve','vortex','moire-rings','checker-distort'];
  $('style').value=styles[Math.floor(Math.random()*styles.length)];
  render();
}
$('rand').addEventListener('click',setRand);

$('png').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='opart-'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png');
  a.click();
  toast('PNG exporté');
});

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity=0,1500);
}

$('turns').value=7;$('thick').value=14;$('dens').value=24;$('rot').value=0;$('seed').value=42;
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Op-Art Generator</title>
<style>
:root{--ink:#000;--paper:#fff;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px}
#side{width:270px;flex:none;border-right:1px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
#side h1{font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:0 0 4px}
.group{display:flex;flex-direction:column;gap:6px}
.group label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.6}
.group .val{float:right;opacity:1;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 10px;letter-spacing:.1em;text-transform:uppercase;font-size:10px;transition:background .12s,color .12s}
button:hover{background:var(--ink);color:var(--paper)}
select{font:inherit;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px}
input[type=range]{width:100%;accent-color:#000}
.row{display:flex;gap:8px}
.row button{flex:1}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0}
canvas{max-width:100%;max-height:100%;border:1px solid var(--ink);background:var(--paper)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:640px){body{flex-direction:column}#side{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--ink)}}
</style>
</head>
<body>
<aside id="side">
  <h1>Op-Art Generator</h1>
  <div class="group">
    <label>Motif</label>
    <select id="style">
      <option value="spiral-zigzag">Chevrons spiraux</option>
      <option value="vortex">Tourbillon</option>
      <option value="moire-ovals">Moiré d'ovales</option>
      <option value="checker-twist">Damier tordu</option>
      <option value="rings-zigzag">Anneaux zigzag</option>
    </select>
  </div>
  <div class="group">
    <label>Bras / fréquence <span class="val" id="v-turns"></span></label>
    <input type="range" id="turns" min="1" max="60" step="1">
  </div>
  <div class="group">
    <label>Bandes <span class="val" id="v-bands"></span></label>
    <input type="range" id="bands" min="2" max="80" step="1">
  </div>
  <div class="group">
    <label>Déformation <span class="val" id="v-warp"></span>%</label>
    <input type="range" id="warp" min="0" max="100" step="1">
  </div>
  <div class="group">
    <label>Rotation <span class="val" id="v-rot"></span>°</label>
    <input type="range" id="rot" min="0" max="360" step="1">
  </div>
  <div class="group">
    <label>Douceur <span class="val" id="v-soft"></span>%</label>
    <input type="range" id="soft" min="0" max="100" step="1">
  </div>
  <div class="group">
    <label>Graine <span class="val" id="v-seed"></span></label>
    <input type="range" id="seed" min="0" max="999" step="1">
  </div>
  <div class="group">
    <label>Négatif</label>
    <select id="invert"><option value="0">Non</option><option value="1">Oui</option></select>
  </div>
  <div class="row">
    <button id="rand">Aléatoire</button>
    <button id="png">Export PNG</button>
  </div>
</aside>
<main id="stage"><canvas id="cv" width="900" height="900"></canvas></main>
<div id="toast">PNG exporté</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const S=900,R=S/2;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const frac=x=>x-Math.floor(x);
const tri=x=>Math.abs(2*frac(x)-1);

function render(){
  const p={
    style:$('style').value,
    turns:+$('turns').value,
    bands:+$('bands').value,
    warp:+$('warp').value/100,
    rot:+$('rot').value*Math.PI/180,
    soft:+$('soft').value/100,
    seed:+$('seed').value,
    inv:$('invert').value==='1'
  };
  const w=waveFn(p);
  const img=ctx.createImageData(S,S);
  const d=img.data;
  const AA=2,step=1/AA,off=step/2;
  let i=0;
  for(let y=0;y<S;y++){
    for(let x=0;x<S;x++){
      let acc=0;
      for(let sy=0;sy<AA;sy++)for(let sx=0;sx<AA;sx++){
        const u=((x+off+sy*step)-R)/R,v=((y+off+sx*step)-R)/R;
        acc+=w(u,v);
      }
      let a=acc/(AA*AA);
      a=a<0?0:a>1?1:a;
      if(p.inv)a=1-a;
      const c=Math.round(a*255);
      d[i++]=c;d[i++]=c;d[i++]=c;d[i++]=255;
    }
  }
  ctx.putImageData(img,0,0);
  labels();
}

function waveFn(p){
  const T=p.turns,B=p.bands,W=p.warp,ROT=p.rot,SD=p.seed;
  const phase=SD*0.371;
  const ca=Math.cos(ROT),sa=Math.sin(ROT);
  const soft=Math.max(0.004,p.soft);
  const edge=x=>Math.min(1,Math.max(0,0.5+x/soft));
  let f;
  switch(p.style){
    case 'spiral-zigzag':
      f=(u,v)=>{
        const x=u*ca-v*sa,y=u*sa+v*ca;
        const r=Math.hypot(x,y),th=Math.atan2(y,x);
        const s=th/Math.PI*T+(r*0.5+0.06)*B*0.5+phase;
        return edge((tri(s)-0.5)*2);
      };
      break;
    case 'vortex':
      f=(u,v)=>{
        const x=u*ca-v*sa,y=u*sa+v*ca;
        const r=Math.hypot(x,y),th=Math.atan2(y,x);
        const s=th/Math.PI*T+Math.log(r+0.03)*B*0.34*(1+W*2)+phase;
        return edge((tri(s)-0.5)*2);
      };
      break;
    case 'moire-ovals':{
      const off=0.22+W*0.6,cx=Math.cos(ROT)*off,cy=Math.sin(ROT)*off;
      const fr=B*0.5+2;
      f=(u,v)=>{
        const d1=Math.hypot(u+cx,v+cy),d2=Math.hypot(u-cx,v-cy);
        const s=Math.sin(d1*fr+phase)+Math.sin(d2*fr+phase);
        return edge(s*0.9);
      };
      break;
    }
    case 'checker-twist':{
      const cell=2.4/Math.max(1,B*0.35),tw=W*14+SD%7*0.5;
      f=(u,v)=>{
        const r=Math.hypot(u,v),a=r*tw+ROT;
        const ca2=Math.cos(a),sa2=Math.sin(a);
        const x=u*ca2-v*sa2,y=u*sa2+v*ca2;
        const par=Math.floor(x/cell)+Math.floor(y/cell);
        const s=((par%2)+2)%2?1:-1;
        return edge(s);
      };
      break;
    }
    case 'rings-zigzag':
      f=(u,v)=>{
        const x=u*ca-v*sa,y=u*sa+v*ca;
        const r=Math.hypot(x,y),th=Math.atan2(y,x);
        const s=r*B*0.5+tri(th/Math.PI*T*0.5+phase)*W*2;
        return edge((tri(s)-0.5)*2);
      };
      break;
    default:f=()=>0.5;
  }
  return f;
}

function labels(){
  $('v-turns').textContent=$('turns').value;
  $('v-bands').textContent=$('bands').value;
  $('v-warp').textContent=$('warp').value;
  $('v-rot').textContent=$('rot').value;
  $('v-soft').textContent=$('soft').value;
  $('v-seed').textContent=$('seed').value;
}

['style','turns','bands','warp','rot','soft','seed','invert'].forEach(id=>{
  $(id).addEventListener('input',render);
  $(id).addEventListener('change',render);
});

$('rand').addEventListener('click',()=>{
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  $('style').value=['spiral-zigzag','vortex','moire-ovals','checker-twist','rings-zigzag'][Math.floor(Math.random()*5)];
  $('turns').value=r(1,60);$('bands').value=r(2,80);
  $('warp').value=r(0,100);$('rot').value=r(0,360);
  $('soft').value=Math.random()<0.7?0:r(2,30);
  $('seed').value=r(0,999);
  render();
});

$('png').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='opart-'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png');
  a.click();
  toast('PNG exporté');
});

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity=0,1500);
}

$('turns').value=8;$('bands').value=26;$('warp').value=0;
$('rot').value=0;$('soft').value=0;$('seed').value=17;
render();
</script>
</body>
</html>
